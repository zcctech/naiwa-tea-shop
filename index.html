<body><main class="game">

<section class="controls"><div class="order-row"><span id="order-name">今日第 1 位客人</span><b id="order-price">珍珠奶茶 · 28 🍪</b></div><button class="order-taste" id="order-taste"></button><div id="craft-card" class="craft-card" hidden></div><button class="action" id="serve">点击接待</button><div class="work-track"><div id="work-progress"></div></div><button id="auto-help" class="auto-help" hidden>这单交给奶娃</button><div class="combo-label" id="combo-label"></div><nav class="nav"><button id="upgrade"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-8h6v8"/></svg>店铺升级</button><button id="decorate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8M7 17c-4 0-5-3-5-3s6-2 10 3M17 17c4 0 5-3 5-3s-6-2-10 3"/><circle cx="12" cy="8" r="4"/></svg>装饰小铺</button><button id="recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v16M3 4h5a4 4 0 0 1 4 2 4 4 0 0 1 4-2h5v15h-5a4 4 0 0 0-4 2 4 4 0 0 0-4-2H3Z"/></svg>配方图鉴</button><button id="equipment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6 4 4-8 8-4-4Z"/><path d="M14 6a5 5 0 0 1 6-3l-3 3 1 2 2 1 3-3a5 5 0 0 1-6 6M6 14l-3 3a3 3 0 0 0 4 4l3-3"/></svg>设备升级</button><button id="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 5 2 2 3-3m-5 9 2 2 3-3m-5 9 2 2 3-3M11 6h10M11 14h10M11 22h10"/></svg>每日任务</button><button id="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4M12 17h.01"/></svg>玩法说明</button></nav></section><footer class="foot" id="save-status">手作奶茶 · 进度自动保存</footer>

<script>
'use strict';
const $=id=>document.getElementById(id),KEY='naiwa-tea-v1',DURATION=8500;
const drinks=[{name:'珍珠奶茶',price:28,color:[.73,.52,.27]},{name:'芋泥奶茶',price:38,color:[.65,.46,.72]},{name:'草莓奶茶',price:45,color:[.9,.53,.62]},{name:'抹茶拿铁',price:46,color:[.56,.66,.4],unlock:120},{name:'焦糖布蕾',price:52,color:[.78,.58,.34],unlock:220},{name:'杨枝甘露',price:58,color:[.95,.69,.32],unlock:360}];
const goods=[{id:'plant',name:'柜台小绿植',desc:'给小铺添一抹清新的绿',cost:90,icon:'🪴',bg:'#e1ebd6'},{id:'flowers',name:'暖阳小花瓶',desc:'一束小花，让每一天都明亮',cost:150,icon:'🌼',bg:'#f3e9c5'},{id:'lights',name:'星星灯串',desc:'把温柔的星光挂在店里',cost:180,icon:'✨',bg:'#ece4ce'},{id:'pink',name:'莓莓粉色墙面',desc:'将奶茶店换成柔软的粉色',cost:240,icon:'🎨',bg:'#f2dfe0'},{id:'blue',name:'晴空蓝色墙面',desc:'像晴天一样轻盈的小铺',cost:240,icon:'🩵',bg:'#dce9ed'}];
function fresh(){return {version:1,coins:120,day:1,level:1,served:0,earned:0,target:6,order:null,owned:[],equipped:[],sound:false};}
let state=fresh(),storageOK=true;
try{let raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s.version===1&&['coins','day','level','served','earned','target'].every(k=>Number.isSafeInteger(s[k]))&&s.coins>=0&&s.day>=1&&s.level>=1&&s.level<=5&&s.target>=6&&s.target<=14&&s.served>=0&&s.served<=s.target&&s.earned>=0){state={...fresh(),...s};state.owned=Array.isArray(s.owned)?goods.filter(g=>s.owned.includes(g.id)).map(g=>g.id):[];state.equipped=Array.isArray(s.equipped)?state.owned.filter(id=>s.equipped.includes(id)):[];if(state.equipped.includes('pink')&&state.equipped.includes('blue'))state.equipped=state.equipped.filter(id=>id!=='blue');if(s.order&&(!Number.isFinite(s.order.start)||!Number.isSafeInteger(s.order.price)||s.order.price<1||s.order.price>200||!Number.isInteger(s.order.drink)||s.order.drink<0||s.order.drink>5||state.served>=state.target))state.order=null;}}}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}$('save-status').textContent=storageOK?'手作奶茶 · 进度自动保存':'本次可正常游玩 · 浏览器未允许保存进度';}
let toastTimer,panelType='',lastFocus=null,audio=null,musicTimer=null,lastPhase=-1;
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200);}
function tone(freq=500,duration=.13){if(!state.sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}catch(e){}}
function startMusic(){clearInterval(musicTimer);if(!state.sound)return;let i=0;const notes=[262,330,392,330,294,349,440,349];musicTimer=setInterval(()=>{if(!document.hidden)tone(notes[i++%notes.length],.55);},900);}
function nextDrink(){return (state.day+state.served-1)%3;}
function nextPrice(){return drinks[nextDrink()].price+6*(state.level-1);}
function elapsed(){return state.order?Math.max(0,Date.now()-state.order.start):0;}
function updateUI(){const busy=!!state.order,closed=state.served>=state.target;
$('level').innerHTML='店铺 LV.'+state.level+'<small>'+['路边奶茶摊','街角小茶铺','温暖奶茶屋','人气奶茶店','奶娃的梦想小铺'][state.level-1]+'</small>';$('day').textContent='DAY '+state.day;$('coins').textContent=state.coins;$('daily-progress').style.width=state.served/state.target*100+'%';$('status-title').textContent=closed?'今日圆满收工':busy?'奶娃正在忙碌':'营业进行中';$('status-desc').textContent='今日已接待 '+state.served+' / '+state.target+' 位';$('serve').disabled=busy;$('serve').textContent=closed?'查看今日结算':busy?'奶娃正在制作…':'点击接待 · 客人来啦';
const d=drinks[busy?state.order.drink:nextDrink()];$('order-name').textContent=closed?'谢谢每一位光临的客人':'今日第 '+(state.served+1)+' 位客人';$('order-price').textContent=closed?'今日收入 '+state.earned+' 🍪':d.name+' · '+(busy?state.order.price:nextPrice())+' 🍪';$('bubble').style.opacity=closed?'0':'1';$('bubble').innerHTML='<b>'+(busy?'好期待奶娃的手艺！':'客人来啦！')+'</b><span>想喝一杯'+d.name+'～</span>';$('work-progress').style.width='0%';$('scene-label').textContent=closed?'今天也辛苦啦，奶娃！':'一杯好茶，一点小幸福';$('sound').textContent=state.sound?'♫':'♪';$('sound').setAttribute('aria-label',state.sound?'关闭声音':'打开声音');$('sound').setAttribute('aria-pressed',String(state.sound));save();}
function serve(){if(state.order)return;if(state.served>=state.target){openPanel('summary');return;}state.order={start:Date.now(),price:nextPrice(),drink:nextDrink()};lastPhase=-1;updateUI();tone(660);}
function finishOrder(){if(!state.order)return;const price=state.order.price;state.coins+=price;state.earned+=price;state.served++;state.order=null;save();updateUI();tone(880,.2);const r=document.createElement('div');r.className='reward';r.textContent='+'+price+' 🍪';document.querySelector('.scene').append(r);setTimeout(()=>r.remove(),1450);if(state.served>=state.target)toast('今日营业完成！查看结算吧');if(panelType)renderPanel();}
function closePanel(){ $('overlay').hidden=true;panelType='';lastFocus?.focus();}
function openPanel(type){lastFocus=document.activeElement;panelType=type;renderPanel();$('overlay').hidden=false;$('close').focus();}
function renderPanel(){const body=$('panel-body'),title=$('panel-title');if(panelType==='upgrade'){const max=state.level===5,cost=state.level*200;title.textContent='让小铺慢慢长大';body.innerHTML='<p class="sub">每次升级都会提高每杯奶茶的收入，并增加下一营业日的接待名额。当日目标保持不变。</p><div class="upgrade-hero"><div class="big">🏡</div><b>店铺 LV.'+state.level+(max?' · 梦想达成':' → LV.'+(state.level+1))+'</b><div class="benefits"><div>每杯额外收入<br><strong>+'+(6*(state.level-1))+(max?'':' → +'+6*state.level)+'</strong> 🍪</div><div>每日接待名额<br><strong>'+(6+2*(state.level-1))+(max?'':' → '+(6+2*state.level))+'</strong> 位</div></div></div><button class="buy wide" id="buy-upgrade" '+(max||state.coins<cost?'disabled':'')+'>'+(max?'已达到最高等级':'升级店铺 · '+cost+' 🍪')+'</button><p class="sub" style="text-align:center">现有饼干 '+state.coins+' 🍪'+(!max&&state.coins<cost?' · 再赚 '+(cost-state.coins)+' 就可以升级啦':'')+'</p>';if(!max)$('buy-upgrade').onclick=()=>{if(state.level>=5||state.coins<state.level*200)return;state.coins-=state.level*200;state.level++;save();updateUI();renderPanel();tone(740);toast('小铺升级啦！奶娃更有干劲了');};}
else if(panelType==='decorate'){title.textContent='装饰奶娃的小铺';body.innerHTML='<p class="sub">喜欢的装饰买一次就能一直使用。点击已拥有的装饰可以摆放或收起；墙面只能选一种。现有 '+state.coins+' 🍪</p>'+goods.map(g=>{const own=state.owned.includes(g.id),on=state.equipped.includes(g.id);return '<div class="item"><div class="swatch" style="background:'+g.bg+'">'+g.icon+'</div><div class="item-info"><b>'+g.name+'</b><small>'+g.desc+'</small></div><button class="buy" data-good="'+g.id+'" '+(!own&&state.coins<g.cost?'disabled':'')+'>'+(own?(on?'已摆放 · 收起':'摆放'):g.cost+' 🍪')+'</button></div>';}).join('');body.querySelectorAll('[data-good]').forEach(b=>b.onclick=()=>{const g=goods.find(x=>x.id===b.dataset.good);if(!state.owned.includes(g.id)){if(state.coins<g.cost)return;state.coins-=g.cost;state.owned.push(g.id);toast('买下了'+g.name);}const on=state.equipped.includes(g.id);state.equipped=state.equipped.filter(id=>id!==g.id);if(!on){if(g.id==='pink'||g.id==='blue')state.equipped=state.equipped.filter(id=>id!=='pink'&&id!=='blue');state.equipped.push(g.id);}save();updateUI();renderPanel();tone(600);});}
else if(panelType==='summary'){title.textContent='DAY '+state.day+' · 营业结算';body.innerHTML='<p class="sub">奶娃认真做好的每一杯奶茶，都变成了小铺成长的力量。</p><div class="upgrade-hero"><div class="big">☀️</div><b>今天也有满满的小幸福</b></div><div class="summary"><div><strong>'+state.served+'</strong><small>接待客人</small></div><div><strong>'+state.earned+'</strong><small>营业收入 🍪</small></div></div><button class="buy wide" id="next-day">准备好了 · 开始第 '+(state.day+1)+' 天</button>';$('next-day').onclick=()=>{if(state.order||state.served<state.target)return;state.day++;state.served=0;state.earned=0;state.target=6+2*(state.level-1);save();closePanel();updateUI();tone(660);};}
else{title.textContent='和奶娃一起开店';body.innerHTML='<p class="sub" style="font-size:14px;line-height:2">① 客人到店后，点击「接待」。<br>② 奶娃会自动加料、摇匀并交付奶茶，约 9 秒完成一单。<br>③ 每单获得饼干，可用来升级店铺、购买装饰。<br>④ 完成当日接待目标后，查看结算并开始下一天。</p><div class="upgrade-hero" style="text-align:left;font-size:13px;line-height:1.9">店铺升级：每杯收入增加 6 饼干，下一天多接待 2 位客人。<br>装饰：买后立即摆放，可随时切换。<br>存档：进度保存在当前浏览器中。<br>声音：点击右上角音符开启音乐与音效。</div>';}}
$('serve').onclick=serve;$('upgrade').onclick=()=>openPanel('upgrade');$('decorate').onclick=()=>openPanel('decorate');$('help').onclick=()=>openPanel('help');$('close').onclick=closePanel;$('overlay').onclick=e=>{if(e.target===$('overlay'))closePanel();};document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape')closePanel();if(e.key==='Tab'){const focusable=[...document.querySelectorAll('.panel button:not(:disabled)')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});$('sound').onclick=()=>{state.sound=!state.sound;updateUI();tone(523);startMusic();};
// Scene assets ship locally, so public play needs no external CDN request.
const canvas=$('scene');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let graphicsReady=false;
import('./assets/scene.js').then(m=>m.createNaiwaScene(canvas,{getState:()=>state,elapsed,reduced,phase:()=>typeof craftPhase==='function'?craftPhase():null,duration:()=>typeof orderDuration==='function'?orderDuration():8500,ready(){graphicsReady=true;$('graphics-error').hidden=true;},error(){$('graphics-error').hidden=false;}})).catch(e=>{$('graphics-error').hidden=false;console.error('Scene initialization:',e);});
function tick(){if(state.order){let e=elapsed();if(e>=DURATION)finishOrder();else{const phase=e<1200?0:e<3200?1:e<5800?2:3;const labels=['奶娃：欢迎光临！','加茶底、放珍珠…','摇一摇，变好喝～','奶茶做好啦，请慢用！'];$('serve').textContent=labels[phase];$('work-progress').style.width=e/DURATION*100+'%';$('scene-label').textContent=labels[phase];if(lastPhase!==phase){lastPhase=phase;tone([440,520,620,740][phase]);}}}setTimeout(tick,100);}
updateUI();
// Optional browser-native tools reuse the actual game state and reception action.
if(document.modelContext?.registerTool){const lifecycle=new AbortController();const empty={type:'object',properties:{},additionalProperties:false};function validateInput(input){if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw new Error('Expected an empty object');}
const tools=[{name:'read_naiwa_game',title:'查看奶娃经营状态',description:'Read current day, coins, store level, reception progress and decorations.',inputSchema:empty,annotations:{readOnlyHint:true},execute(input){validateInput(input);return JSON.parse(JSON.stringify(state));}},{name:'receive_naiwa_customer',title:'接待奶娃奶茶铺顾客',description:'Start automatic service for the current customer. Does not immediately grant revenue. Fails if service is running or the day is complete.',inputSchema:empty,annotations:{readOnlyHint:false},execute(input){validateInput(input);if(state.order)throw new Error('A customer is already being served');if(state.served>=state.target)throw new Error('The operating day is complete');serve();return {day:state.day,customer:state.served+1,order:{...state.order}};}}];
for(const tool of tools){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch(e){}}addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}
</script><script src="./assets/gameplay.js"></script><script src="./assets/experience.js"></script></body></html>
